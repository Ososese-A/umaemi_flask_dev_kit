[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Flask-UI-Kit"
version = "0.1.0"
description = "A collection of pre-built components and middlewares for Flask"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flask_ui_kit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/flask_ui_kit/templates"
]